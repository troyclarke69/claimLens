<header class="site-header">
  <div class="wrap bar">
    <a routerLink="/" class="brand" aria-label="ClaimLens home">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <rect x="4" y="2.5" width="13" height="17" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
        <path d="M7.5 7h6M7.5 10.5h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle cx="16" cy="16" r="3.6" fill="var(--bg)" stroke="var(--accent)" stroke-width="2" />
        <path d="M18.6 18.6 21 21" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
      </svg>
      ClaimLens
    </a>
    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
      <a routerLink="/demo" routerLinkActive="active">Demo</a>
      <a [href]="repo" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <router-outlet />
</main>

<footer class="wrap site-footer">
  <p>
    All documents are synthetic; no real personal information is used. Built by Troy Clarke with AI assistance.
    <a [href]="repo + '/blob/main/PROJECT_SUMMARY.md'" target="_blank" rel="noopener">Project summary</a> ·
    <a [href]="repo + '/blob/main/docs/RESULTS.md'" target="_blank" rel="noopener">Full results</a>
  </p>
</footer>
